<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Group</title>

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background: linear-gradient(to right, #ff9ecf, #ff69b4);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .container{
        width:450px;
        background:white;
        padding:35px;
        border-radius:20px;
        box-shadow:0 10px 25px rgba(0,0,0,0.25);
    }

    h1{
        text-align:center;
        margin-bottom:25px;
        color:#ff1493;
    }

    .form-group{
        margin-bottom:18px;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-weight:bold;
        color:#444;
    }

    input{
        width:100%;
        padding:12px;
        border:1px solid #ffc0cb;
        border-radius:10px;
        outline:none;
        transition:0.3s;
        font-size:15px;
    }

    input:focus{
        border-color:#ff1493;
        box-shadow:0 0 8px rgba(255,20,147,0.3);
    }

    .btn{
        width:100%;
        padding:12px;
        border:none;
        background:#ff1493;
        color:white;
        font-size:16px;
        border-radius:10px;
        cursor:pointer;
        transition:0.3s;
        font-weight:bold;
    }

    .btn:hover{
        background:#e01284;
    }

    .back{
        display:block;
        text-align:center;
        margin-top:15px;
        text-decoration:none;
        color:#ff1493;
        font-weight:bold;
    }

    .back:hover{
        text-decoration:underline;
    }

</style>

</head>

<body>

<div class="container">

    <h1>Add New Group</h1>

    <form method="POST">

        <div class="form-group">
            <label>Group Name</label>
            <input type="text" name="group_name" required>
        </div>

        <div class="form-group">
            <label>Fandom Name</label>
            <input type="text" name="fandom_name" required>
        </div>

        <div class="form-group">
            <label>Debut Year</label>
            <input type="number" name="debut_year" required>
        </div>

        <div class="form-group">
            <label>Agency</label>
            <input type="text" name="agency" required>
        </div>

        <button type="submit" class="btn">
            Add Group
        </button>

    </form>

    <a href="/groups" class="back">
        ← Back to Groups
    </a>

</div>

</body>
</html>
