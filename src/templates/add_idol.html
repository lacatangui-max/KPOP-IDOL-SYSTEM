<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Idol</title>

    <link rel="icon" href="/static/kpop.jpg">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        .form-container {
            max-width: 600px;
            margin: auto;
            margin-top: 50px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: purple;
            text-align: center;
            margin-bottom: 30px;
        }

        .btn-purple {
            background-color: purple;
            color: white;
        }

        .btn-purple:hover {
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="form-container">

            <h1>Add New Idol</h1>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Stage Name</label>
                    <input
                        type="text"
                        name="stage_name"
                        class="form-control"
                        placeholder="Enter stage name"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Real Name</label>
                    <input
                        type="text"
                        name="real_name"
                        class="form-control"
                        placeholder="Enter real name"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Birthdate</label>
                    <input
                        type="date"
                        name="birthdate"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nationality</label>
                    <input
                        type="text"
                        name="nationality"
                        class="form-control"
                        placeholder="Enter nationality"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Position</label>
                    <input
                        type="text"
                        name="position"
                        class="form-control"
                        placeholder="Enter position"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Instagram</label>
                    <input
                        type="text"
                        name="instagram"
                        class="form-control"
                        placeholder="Enter Instagram username">
                </div>

                <div class="mb-3">
                    <label class="form-label">Group ID</label>
                    <input
                        type="number"
                        name="group_id"
                        class="form-control"
                        placeholder="Enter group ID"
                        required>
                </div>

                <div class="d-grid gap-2">

                    <button
                        type="submit"
                        class="btn btn-purple btn-lg">
                        ADD IDOL
                    </button>

                    <a
                        href="/idols"
                        class="btn btn-secondary">
                        Back to Idols
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
