<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KPOP Albums</title>

    <link rel="icon" href="/static/kpop.jpg">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: linear-gradient(to right, #fbc2eb, #a6c1ee);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .table-container {
            margin-top: 50px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 6px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
            color: #6a0572;
            letter-spacing: 2px;
        }

        /* BUTTONS */

        .btn-success {
            background-color: #00c9a7;
            border: none;
            font-weight: bold;
        }

        .btn-success:hover {
            background-color: #00a98b;
        }

        .btn-secondary {
            background-color: #845ec2;
            border: none;
            font-weight: bold;
        }

        .btn-secondary:hover {
            background-color: #6f4db0;
        }

        .btn-warning {
            background-color: #ffc75f;
            border: none;
            color: black;
            font-weight: bold;
        }

        .btn-warning:hover {
            background-color: #f5b942;
        }

        .btn-danger {
            background-color: #ff6f91;
            border: none;
            font-weight: bold;
        }

        .btn-danger:hover {
            background-color: #e85d7f;
        }

        /* TABLE */

        .table {
            border-radius: 15px;
            overflow: hidden;
        }

        .table-dark {
            background: linear-gradient(to right, #845ec2, #d65db1) !important;
            color: white;
        }

        .table-hover tbody tr:hover {
            background-color: #f3e8ff;
            transition: 0.3s;
        }

        /* SEARCH BAR */

        #searchInput {
            border-radius: 12px;
            border: 2px solid #d65db1;
            padding: 10px;
        }

        #searchInput:focus {
            box-shadow: 0 0 10px rgba(214,93,177,0.5);
            border-color: #845ec2;
        }

        /* HIGHLIGHT */

        .highlight {
            background-color: #ffe066 !important;
            color: black;
            font-weight: bold;
            border-radius: 5px;
            padding: 2px;
        }

        .action-btn {
            margin-right: 5px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="table-container">

        <h1>KPOP ALBUMS</h1>

        <div class="mb-3">

            <a href="/add_album" class="btn btn-success">
                Add New Album
            </a>

            <a href="/" class="btn btn-secondary">
                Back to Home
            </a>

        </div>

        <!-- SEARCH BAR -->
        <form method="GET" class="mb-3">

            <input
                type="text"
                name="search"
                class="form-control"
                placeholder="Search albums..."
                value="{{ request.args.get('search', '') }}">

        </form>

        <table class="table table-bordered table-striped table-hover">

            <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Album Name</th>
                    <th>Release Date</th>
                    <th>Album Type</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody>

                {% for album in albums %}
                <tr>

                    <td>{{ album[0] }}</td>
                    <td>{{ album[1] }}</td>
                    <td>{{ album[2] }}</td>
                    <td>{{ album[3] }}</td>

                    <td>

                        <a
                            href="/edit_album/{{ album[0] }}"
                            class="btn btn-warning btn-sm action-btn">
                            Edit
                        </a>

                        <a
                            href="/delete_album/{{ album[0] }}"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Are you sure you want to delete this album?')">
                            Delete
                        </a>

                    </td>

                </tr>
                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
