<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Group</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: linear-gradient(to right, #1e1e2f, #2b1055);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            width:450px;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        .title{
            text-align:center;
            margin-bottom:25px;
        }

        .title h1{
            color:#2b1055;
            margin-bottom:5px;
        }

        .title p{
            color:gray;
            font-size:14px;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:7px;
            font-weight:bold;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            transition:0.3s;
        }

        input:focus{
            border-color:#6a0dad;
            box-shadow:0 0 8px rgba(106,13,173,0.3);
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            background:#6a0dad;
            color:white;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#520b87;
        }

        .back-btn{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
            color:#6a0dad;
            font-weight:bold;
        }

        .back-btn:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="title">
        <h1>Edit K-Pop Group</h1>
        <p>Update group information</p>
    </div>

    <form method="POST">

        <div class="form-group">
            <label>Group Name</label>
            <input type="text" name="group_name" value="{{ group.group_name }}" required>
        </div>

        <div class="form-group">
            <label>Fandom Name</label>
            <input type="text" name="fandom_name" value="{{ group.fandom_name }}" required>
        </div>

        <div class="form-group">
            <label>Debut Year</label>
            <input type="number" name="debut_year" value="{{ group.debut_year }}" required>
        </div>

        <div class="form-group">
            <label>Agency</label>
            <input type="text" name="agency" value="{{ group.agency }}" required>
        </div>

        <button type="submit" class="btn">
            Update Group
        </button>

    </form>

    <a href="/groups" class="back-btn">
        ← Back to Groups
    </a>

</div>

</body>
</html>
