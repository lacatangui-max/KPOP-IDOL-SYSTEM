<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Song</title>

    <link rel="icon" href="/static/kpop.jpg">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .form-container {
            margin-top: 60px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
            color: #d63384;
        }

        .btn-primary {
            background-color: #ff5e78;
            border: none;
            font-weight: bold;
        }

        .btn-primary:hover {
            background-color: #e14b65;
        }

        .btn-secondary {
            background-color: #845ec2;
            border: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="form-container">

        <h1>EDIT SONG</h1>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Song Title
                </label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    value="{{ song[1] }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Duration
                </label>

                <input
                    type="text"
                    name="duration"
                    class="form-control"
                    value="{{ song[2] }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Genre
                </label>

                <input
                    type="text"
                    name="genre"
                    class="form-control"
                    value="{{ song[3] }}"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary">

                Update Song

            </button>

            <a
                href="/songs"
                class="btn btn-secondary">

                Back

            </a>

        </form>

    </div>

</div>

</body>
</html>
