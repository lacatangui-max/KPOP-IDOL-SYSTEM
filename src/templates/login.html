<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #1e1e2f, #8e8eb8);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }

        .login-box{
            width: 500px;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
        }

        h1{
            text-align: center;
            color: purple;
            margin-bottom: 30px;
            font-weight: bold;
        }

        button{
            width: 100%;
        }

    </style>
</head>

<body>

<div class="login-box">

    <h1>🎵 KPOP LOGIN</h1>

    <form method="POST">

        <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control">
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control">
        </div>

        <button class="btn btn-dark">
            LOGIN
        </button>

    </form>

    <br>

</div>

</body>

</html>
